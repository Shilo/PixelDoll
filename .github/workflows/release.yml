name: Release

on:
  schedule:
    # The release day and the day after (a backup if GitHub drops a scheduled run), just after releases/schedule.json's
    # hourUtc. Keep it in step with that file (release-history.test.ts checks); other days need no run.
    - cron: "17 15 * * 5,6"
  # Editing a published release's notes or banner on main re-publishes it on GitHub and in the app.
  push:
    branches: [main]
    paths: ["releases/*/notes.*.json", "releases/*/banner.png"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release without writing or calling Claude
        type: boolean
        default: false
      max:
        description: Most releases to publish in this run (backfill one at a time to check each)
        type: number
        default: 1
      update:
        description: Re-publish these released versions from their folders, space-separated (e.g. 1.4.12)
        type: string
        default: ""

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm ci runs package scripts; the push token is set up after it
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: Set up release commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
      - name: Run release pipeline
        # One release per run by default: a failure never repeats more than one release's paid Claude calls. A push of
        # edited release files, or the update input, re-publishes those versions instead (app/scripts/release/main.ts).
        run: npm run release
        env:
          RELEASE_EDITS_SINCE: ${{ github.event_name == 'push' && github.event.before || '' }}
          RELEASE_UPDATE: ${{ inputs.update }}
          RELEASE_MAX: ${{ inputs.max || 1 }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          RELEASE_PAGES: ${{ vars.RELEASE_PAGES }}
          RELEASE_DEPLOYMENTS_REPOSITORY: ${{ vars.RELEASE_DEPLOYMENTS_REPOSITORY }}
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
