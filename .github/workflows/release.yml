name: Release

on:
  schedule:
    # The release day and the day after (a backup if GitHub drops a scheduled run), just after releases/schedule.json's
    # hourUtc. Keep it in step with that file (release-history.test.ts checks); other days need no run.
    - cron: "17 15 * * 5,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the release without writing or calling Claude
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  deployments: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # npm ci runs package scripts; the push token is set up after it
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: Set up release commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
      - name: Run release pipeline
        run: npm run release ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
