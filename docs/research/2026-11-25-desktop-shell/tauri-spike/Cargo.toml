[package]
name = "pixeldoll-tauri-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
png = "=0.18.1"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.7", features = [] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = true
