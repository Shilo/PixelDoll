<script>
const query = new URLSearchParams(location.search);
const $ = (selector) => document.querySelector(selector);
const sheet = $('dialog');
const connectedTier = '2';
const plans = {
  1: { low: 9, list: 12, allowance: 2000 },
  2: { low: 22, list: 24, allowance: 5000 },
  3: { low: 50, list: 50, allowance: 10000 }
};
const planFor = (tier) => plans[tier === '0' ? '1' : tier];
const costAt = (gens, price, plan) => gens * price / plan.allowance;
const listCost = (gens, plan) => costAt(gens, plan.list, plan);
const usdFormat = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const gensFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
const integerFormat = new Intl.NumberFormat('en-US');
const cash = (value) => usdFormat.format(value);
const units = (gens) => gensFormat.format(gens) + ' gens';
const count = (value) => integerFormat.format(value);
const sum = (values) => values.reduce((total, value) => total + value, 0);

const compass = [
  ['NW', 'Northwest', -45, 'NE'], ['N', 'North', 0], ['NE', 'Northeast', 45, 'NW'],
  ['W', 'West', -90, 'E'], null, ['E', 'East', 90, 'W'],
  ['SW', 'Southwest', -135, 'SE'], ['S', 'South', 180], ['SE', 'Southeast', 135, 'SW']
];
const directions = Object.fromEntries(compass.filter(Boolean).map(([id, label, angle, partner]) =>
  [id, { label, angle, partner }]));
const eight = { NW: 'NE', N: true, NE: true, W: 'E', E: true, SW: 'SE', S: true, SE: true };
const four = { N: true, W: 'E', E: true, S: true };
const demoFacings = ['S', 'E', 'N'];
const drawnFacings = (views) => Object.keys(views).filter((id) => views[id] === true);

const movesOf = (names, frames, route) => names.map((name, index) => ({
  name, frames: Array.isArray(frames) ? frames[index] : frames, route
}));
const worn = (name, skipped = [], id) => ({ name, id, all: true, exceptions: new Set(skipped) });
const held = (name, indices, id, all = false) => ({ name, id, held: true, all, exceptions: new Set(indices) });
const demoMoves = movesOf(['Walk', 'Cross punch'], [8, 6], 'authored');
const demoItems = [
  worn('Leather vest', [], 'vest_leather'), worn('Red cape', [], 'cape_red'),
  worn('Messy brown hair', [], 'hair_brown'), worn('Steel helmet', [], 'helmet_steel'),
  worn('Wizard hat', [1], 'hat_wizard'), held('Steel longsword', [], 'sword_steel', true)
];

// Saved steps retain the original paid call and each paid replacement separately.
const adventurer = {
  name: query.has('long-name')
    ? 'Adventurer of the Lantern Road and the Seven Forgotten Kingdoms' : 'Adventurer',
  body: 64, frame: 64, views: eight, stateRoute: 'pro', states: 0,
  moves: movesOf(['Walk', 'Run', 'Slash', 'Thrust', 'Cast', 'Hurt'], 8, 'authored'),
  items: [
    ...['Hair', 'Hood', 'Tunic', 'Gloves', 'Belt', 'Pants', 'Boots', 'Cape'].map((name) => worn(name)),
    held('Sword', [1, 2, 3]), held('Staff', [1, 3, 4])
  ],
  records: [
    { paid: { gens: 10 }, replaced: [{ gens: 10 }, { gens: 10 }] },
    { paid: { gens: 3 }, replaced: [{ gens: 3 }, { usd: 0.08 }] },
    { paid: { unpriced: true }, replaced: [{ gens: 3 }, { gens: 3 }] }
  ]
};
const scout = {
  name: 'Scout', body: 64, frame: 64, views: four, stateRoute: 'pixen', states: 1,
  moves: movesOf(['Walk', 'Dodge'], 8, 'pixminimax'), items: [worn('Hood'), worn('Satchel')],
  records: []
};
const demo = {
  name: 'Adventurer demo', body: 64, frame: 64, views: four, stateRoute: 'pro', states: 0,
  moves: demoMoves, items: demoItems, records: [], demo: true, locked: true
};
const demoCopy = {
  ...demo, name: 'Adventurer copy', locked: false,
  moves: [...demoMoves, ...movesOf(['Hurt'], 8, 'authored')],
  items: [...demoItems, worn('Gloves'), worn('Boots')]
};
const newCharacter = {
  name: 'New', body: 64, frame: 80, views: eight, stateRoute: 'pro',
  states: 0, moves: [], items: [], records: []
};
const roster = [adventurer, scout, demoCopy];

function wholeNumber(value, minimum = 0) {
  if (!/^\d+$/.test(value ?? '')) return undefined;
  const number = Number(value);
  return Number.isSafeInteger(number) && number >= minimum ? number : undefined;
}
const retryFlag = wholeNumber(query.get('retries'));
const tierFlag = query.get('tier');
const initialTier = /^[0-3]$/.test(tierFlag ?? '') ? tierFlag : connectedTier;
let tier = initialTier;
const retryRate = (records) => records.length
  ? Math.round(sum(records.map(({ replaced }) => replaced.length)) / records.length)
  : 2;
function seed(character) {
  // Keep counts separate from the receipt rows so typing a large count stays inexpensive.
  const moveTypes = new Map();
  for (const { frames, route } of character.moves) {
    const key = route + ':' + frames;
    moveTypes.set(key, (moveTypes.get(key) ?? 0) + 1);
  }
  const typical = character.moves.reduce((best, move) => {
    const frequency = (entry) => moveTypes.get(entry.route + ':' + entry.frames) ?? 0;
    return frequency(move) > frequency(best) ? move : best;
  }, character.moves[0] ?? { frames: 8, route: 'pixminimax' });
  return {
    character, typical, views: { ...character.views }, moves: character.moves.length,
    items: character.items.length, states: character.states, retries: retryFlag ?? retryRate(character.records),
    frameEdits: new Map(), itemEdits: new Map()
  };
}
const scenarios = new Map();
let selected = query.has('demo-copy') ? demoCopy : query.has('demo') ? demo : adventurer;
let scope = query.has('all') ? 'all' : query.has('new') ? 'new' : 'character';
function scenarioFor(character) {
  if (!scenarios.has(character)) scenarios.set(character, seed(character));
  return scenarios.get(character);
}
const current = () => scenarioFor(scope === 'new' ? newCharacter : selected);
const allRecords = roster.flatMap(({ records }) => records);
const allInitialRetries = retryFlag ?? retryRate(allRecords);
let allRetries = allInitialRetries;
const rosterSeeds = roster.map(seed);
const moveAt = (s, index) => {
  const move = s.character.moves[index] ?? { ...s.typical, name: 'Move ' + (index + 1) };
  return { ...move, frames: s.frameEdits.get(index) ?? move.frames };
};
const itemAt = (s, index) => s.itemEdits.get(index) ?? s.character.items[index] ?? worn('Item ' + (index + 1));
const covers = (item, index) => item.all !== item.exceptions.has(index);
const coveredCount = (item, moves) => {
  const exceptions = [...item.exceptions].filter((index) => index < moves).length;
  return item.all ? moves - exceptions : exceptions;
};

const jointCheck = 0.1;
const poseThreshold = 12;
const poseGens = (frames) => frames <= 3 ? 2 : frames <= poseThreshold ? 3 : 4;
const minimax = {
  64: [1, 1, 2, 2, 3, 3, 4, 5, 5, 6],
  80: [1, 1, 1, 1, 1, 2, 2, 2, 2, 3]
};
const bodyGens = ({ frames, route }, frame) =>
  (route === 'authored' ? poseGens(frames) : minimax[frame][frames / 4 - 1]) + frames * jointCheck;
function fitGens(frames) {
  const batches = Math.ceil(frames / 15);
  const smaller = Math.floor(frames / batches);
  const largerCount = frames % batches;
  return (batches - largerCount) * poseGens(smaller) + largerCount * poseGens(smaller + 1);
}

// Compare represented demo IDs and coverage. A frame edit represents changed body hashes.
function demoFitFacings(original, index) {
  if (!original || index >= demoMoves.length || !covers(original, index)) return [];
  if (index === 1) return ['S'];
  return original.id === 'hat_wizard' ? ['S', 'E'] : demoFacings;
}
function estimate(s, retries = s.retries) {
  const { character } = s;
  const facings = drawnFacings(s.views);
  const newFacings = character.demo ? facings.filter((id) => !demoFacings.includes(id)) : facings;
  const attempts = 1 + retries;
  const setup = newFacings.length
    ? (1 + Math.ceil(8 * character.body ** 2 / 65536) + 0.25 + newFacings.length * jointCheck) * attempts
    : 0;
  const unchanged = (index) => character.demo && demoMoves[index]?.frames === moveAt(s, index).frames;
  const bodyAt = (index) =>
    (unchanged(index) ? newFacings.length : facings.length) * bodyGens(moveAt(s, index), character.frame) * attempts;
  const specialMoves = new Set([...character.moves.keys(), ...s.frameEdits.keys()].filter((index) => index < s.moves));
  const typicalFit = fitGens(s.typical.frames);
  const body = (s.moves - specialMoves.size) * facings.length * bodyGens(s.typical, character.frame) * attempts
    + sum([...specialMoves].map(bodyAt));

  const originalOf = (item) => character.demo ? demoItems.find(({ id }) => id === item.id) : undefined;
  function coveredFacings(item, index) {
    const originalFacings = demoFitFacings(originalOf(item), index);
    return originalFacings.length
      ? facings.filter((id) => originalFacings.includes(id) || newFacings.includes(id)) : facings;
  }
  function itemTotal(item) {
    const original = originalOf(item);
    const source = item.recolorOf < s.items ? itemAt(s, item.recolorOf) : undefined;
    const dressFacings = (original ? newFacings : facings).length;
    const side = character.frame + (item.held ? 32 : 0);
    const cap = side <= 64 ? 16 : side <= 80 ? 9 : 4;
    const dress = !source && dressFacings ? 10 * (1 + Math.ceil(Math.max(0, dressFacings - cap) / (cap - 1))) : 0;
    const fitPerMove = (index) => fitGens(moveAt(s, index).frames);
    let fit = coveredCount(item, s.moves) * facings.length * typicalFit;
    // Generic move slots all have the same fit cost. Only explicit coverage or frames change it.
    for (const index of specialMoves) {
      if (!covers(item, index)) continue;
      const reusable = unchanged(index) ? demoFitFacings(original, index) : [];
      const paid = coveredFacings(item, index).filter((id) => !reusable.includes(id)).length;
      fit += paid * fitPerMove(index) - facings.length * typicalFit;
    }
    if (source) {
      const exceptions = new Set([...specialMoves, ...item.exceptions, ...source.exceptions]);
      let shared = item.all && source.all ? s.moves : 0;
      let specificFit = 0;
      for (const index of exceptions) {
        if (index >= s.moves) continue;
        if (item.all && source.all) shared--;
        if (!covers(item, index) || !covers(source, index)) continue;
        const available = coveredFacings(source, index);
        specificFit += coveredFacings(item, index).filter((id) => available.includes(id)).length * fitPerMove(index);
      }
      fit -= shared * facings.length * typicalFit + specificFit;
    }
    return (dress + fit) * attempts;
  }
  const itemCostAt = (index) => itemTotal(itemAt(s, index));
  const specialItems = new Set([...character.items.keys(), ...s.itemEdits.keys()].filter((index) => index < s.items));
  const items = (s.items - specialItems.size) * itemTotal(worn(''))
    + sum([...specialItems].map(itemCostAt));
  const states = facings.length ? s.states * (character.stateRoute === 'pixen' ? 1 : 10 + facings.length * jointCheck) * attempts : 0;
  return { setup, body, items, states, total: setup + body + items + states, bodyAt, itemCostAt, coveredFacings, facings };
}
const icon = (id) => '<svg class="icon" aria-hidden="true"><use href="#' + id + '"/></svg>';
function button(label, className = 'bu-action') {
  const control = document.createElement('button');
  control.type = 'button';
  control.className = className;
  control.textContent = label;
  return control;
}
function showCost(element, gens, plan, credit = 0) {
  const amount = cash(listCost(gens, plan) + credit);
  const secondary = document.createElement('span');
  secondary.className = 'secondary';
  secondary.textContent = units(gens);
  element.replaceChildren(amount, secondary);
  return amount;
}
function stepper(label, key, read, write, description) {
  const row = document.createElement('div');
  row.className = 'step-row';
  row.innerHTML = '<label></label><div class="stepper"><input type="number" inputmode="numeric" min="0" step="1" class="bu-focus step-value"></div>';
  const name = row.querySelector('label');
  const input = row.querySelector('input');
  name.htmlFor = input.id = key;
  name.textContent = label;
  if (description) {
    const note = document.createElement('span');
    note.className = 'setting';
    note.id = description;
    name.append(note);
    input.setAttribute('aria-describedby', description);
  }
  const less = button('', 'bu-action icon-button');
  const more = button('', 'bu-action icon-button');
  less.innerHTML = icon('minus');
  more.innerHTML = icon('plus');
  less.setAttribute('aria-label', 'Decrease ' + label.toLowerCase());
  more.setAttribute('aria-label', 'Increase ' + label.toLowerCase());
  input.before(less);
  input.after(more);
  const refresh = (keepInput = false) => {
    if (!keepInput) input.value = read();
    less.setAttribute('aria-disabled', String(read() === 0));
  };
  const commit = (value, keepInput = false) => {
    if (value !== undefined && value !== read()) {
      write(value);
      update(keepInput ? input : undefined);
    } else if (!keepInput) refresh();
  };
  input.addEventListener('input', () => commit(wholeNumber(input.value), true));
  input.addEventListener('change', () => refresh());
  input.addEventListener('blur', () => refresh());
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    commit(wholeNumber(input.value));
  });
  less.addEventListener('click', () => {
    if (read() > 0) commit(read() - 1);
  });
  more.addEventListener('click', () => commit(wholeNumber(String(read() + 1))));
  return { row, input, refresh };
}

const retryControl = stepper(
  'Retries', 'retries',
  () => scope === 'all' ? allRetries : current().retries,
  (value) => { if (scope === 'all') allRetries = value; else current().retries = value; },
  'retry-source'
);
retryControl.input.setAttribute('aria-label', 'Retries, extra attempts per paid step');
$('#retry-control').append(retryControl.row);
const countControls = ['moves', 'items', 'states'].map((key) => {
  const control = stepper(key[0].toUpperCase() + key.slice(1), key + '-count',
    () => current()[key], (value) => { current()[key] = value; });
  $('#counts').append(control.row);
  return control;
});

const directionControls = new Map();
for (const definition of compass) {
  const tile = document.createElement('div');
  $('#compass').append(tile);
  if (!definition) {
    tile.className = 'compass-center';
    tile.innerHTML = icon('person');
    continue;
  }
  const [id, label, angle, partner] = definition;
  tile.className = 'direction-tile';
  const facing = button('', 'bu-action direction');
  facing.dataset.variant = 'field';
  facing.innerHTML = icon('arrow-up') + '<span>' + id + '</span>';
  facing.querySelector('svg').style.transform = 'rotate(' + angle + 'deg)';
  facing.addEventListener('click', () => {
    const views = current().views;
    if (views[id]) {
      delete views[id];
      if (views[partner] === id) views[partner] = true;
    } else views[id] = true;
    update();
  });
  tile.append(facing);
  let mirror;
  if (partner && id.includes('W')) {
    mirror = button('', 'bu-action mirror');
    mirror.dataset.variant = 'field';
    mirror.innerHTML = icon('mirror-views');
    mirror.title = 'Mirror ' + label + ' from ' + directions[partner].label;
    mirror.setAttribute('aria-label', mirror.title);
    mirror.addEventListener('click', () => {
      const views = current().views;
      views[id] = views[id] === partner ? true : partner;
      views[partner] = true;
      update();
    });
    tile.prepend(mirror);
  }
  directionControls.set(id, { facing, mirror });
}
function refreshCompass(s, facings) {
  $('#direction-count').textContent = Object.keys(s.views).length + ' · ' + facings.length + ' drawn';
  for (const [id, { facing, mirror }] of directionControls) {
    const source = directions[s.views[id]];
    facing.title = directions[id].label + (source ? ', mirrored from ' + source.label : '');
    facing.setAttribute('aria-label', facing.title);
    facing.setAttribute('aria-pressed', String(Boolean(s.views[id])));
    mirror?.setAttribute('aria-pressed', String(Boolean(source)));
  }
}

const pageSize = 16;
let moveLimit = pageSize;
let itemLimit = pageSize;
const coverageLimits = new Map();
function moreRows(label, show, nextFocus) {
  const more = button(label, 'bu-action receipt-more');
  more.addEventListener('click', () => {
    show();
    update();
    nextFocus()?.focus();
  });
  return more;
}
function receiptRow(name, setting, gens, plan, key, open, editor) {
  const row = document.createElement('details');
  row.name = key.split('-')[0] + '-editor';
  row.id = key;
  row.open = open;
  row.innerHTML = '<summary><span class="label"><span></span><span class="setting"></span></span><span class="cost"></span>' + icon('chevron-down') + '</summary>';
  row.querySelector('.label > span').textContent = name;
  row.querySelector('.setting').textContent = setting;
  showCost(row.querySelector('.cost'), gens, plan);
  if (open) row.append(editor());
  row.addEventListener('toggle', () => {
    if (row.open && !row.querySelector('.editor')) row.append(editor());
  });
  return row;
}
function editorBox() {
  const editor = document.createElement('div');
  editor.className = 'editor';
  return editor;
}
const routeNames = { authored: 'Skeleton V3', pixminimax: 'PixMiniMax', pro: 'Local Pro', pixen: 'Pixen' };
function moveEditor(s, index) {
  const { name, frames, route } = moveAt(s, index);
  const editor = editorBox();
  const label = document.createElement('label');
  label.className = 'step-row';
  label.textContent = 'Frames';
  const picker = document.createElement('select');
  picker.id = 'frames-' + index;
  picker.disabled = s.character.locked === true;
  picker.className = 'bu-input';
  picker.style.width = 'auto';
  picker.setAttribute('aria-label', name + ' frames');
  const choices = route === 'authored'
    ? Array.from({ length: 13 }, (_, n) => n + 3)
    : Array.from({ length: 10 }, (_, n) => (n + 1) * 4);
  for (const choice of choices) picker.add(new Option(choice, choice, false, frames === choice));
  picker.addEventListener('change', () => {
    const next = Number(picker.value);
    const original = s.character.moves[index] ?? s.typical;
    if (next === original.frames) s.frameEdits.delete(index);
    else s.frameEdits.set(index, next);
    update();
  });
  label.append(picker);
  editor.append(label);
  return editor;
}
function itemEditor(s, index) {
  const item = itemAt(s, index);
  const editor = editorBox();
  const choices = document.createElement('fieldset');
  choices.className = 'choice-list';
  choices.innerHTML = '<legend>Fit to moves</legend>';
  const limit = Math.min(s.moves, coverageLimits.get(index) ?? pageSize);
  for (let move = 0; move < limit; move++) {
    const label = document.createElement('label');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.id = 'fit-' + index + '-' + move;
    check.checked = covers(item, move);
    check.disabled = s.character.locked === true;
    check.addEventListener('change', () => {
      const next = structuredClone(item);
      if (check.checked === next.all) next.exceptions.delete(move);
      else next.exceptions.add(move);
      const original = s.character.items[index] ?? worn(item.name);
      if (next.recolorOf === undefined && next.exceptions.size === original.exceptions.size
        && [...next.exceptions].every((entry) => original.exceptions.has(entry))) s.itemEdits.delete(index);
      else s.itemEdits.set(index, next);
      update();
    });
    label.append(check, moveAt(s, move).name);
    choices.append(label);
  }
  if (!s.moves) choices.append('Standing only');
  editor.append(choices);
  if (limit < s.moves) editor.append(moreRows('Show more coverage',
    () => coverageLimits.set(index, limit + pageSize), () => $('#fit-' + index + '-' + limit)));
  return editor;
}
function coverageLabel(s, item) {
  const covered = coveredCount(item, s.moves);
  if (!covered) return 'Standing only';
  if (covered === s.moves) return 'All ' + count(s.moves) + (s.moves === 1 ? ' move' : ' moves');
  if (!item.all && covered <= 6) return [...item.exceptions]
    .filter((index) => index < s.moves).sort((a, b) => a - b).map((index) => moveAt(s, index).name).join(', ');
  return count(covered) + ' of ' + count(s.moves) + ' moves';
}
function renderRows(s, result, plan) {
  for (const [key, limit, costAtIndex, describe, editor] of [
    ['moves', moveLimit, result.bodyAt, (index) => {
      const move = moveAt(s, index);
      return [move.name, move.frames + ' frames · ' + routeNames[move.route]];
    }, moveEditor],
    ['items', itemLimit, result.itemCostAt, (index) => {
      const item = itemAt(s, index);
      const kind = item.held ? ' · Held' : item.recolorOf < s.items ? ' · ' + itemAt(s, item.recolorOf).name + ' recolor' : '';
      return [item.name, coverageLabel(s, item) + kind];
    }, itemEditor]
  ]) {
    if (!$('#details').open || !$('#' + key + '-row').open) continue;
    const list = $('#' + key);
    const open = list.querySelector('details[open]')?.id;
    const visible = Math.min(s[key], limit);
    const rows = [];
    if (!visible) {
      const empty = document.createElement('p');
      empty.className = 'setting';
      empty.textContent = 'No ' + key;
      rows.push(empty);
    }
    for (let index = 0; index < visible; index++) {
      const id = key + '-' + index;
      rows.push(receiptRow(...describe(index), costAtIndex(index), plan, id, open === id, () => editor(s, index)));
    }
    if (visible < s[key]) rows.push(moreRows('Show more ' + key, () => {
      if (key === 'moves') moveLimit += pageSize;
      else itemLimit += pageSize;
    }, () => $('#' + key + '-' + visible + ' > summary')));
    list.replaceChildren(...rows);
  }
}

function candidateTips(s, total, plan) {
  const candidates = [];
  const cents = (gens) => Math.round(listCost(gens, plan) * 100);
  function compare(label, change) {
    const next = { ...structuredClone(s), character: s.character };
    change(next);
    const saving = (cents(total) - cents(estimate(next).total)) / 100;
    if (saving > 0) candidates.push({ label, next, saving });
  }
  const canMirror = ['NW', 'W', 'SW'].filter((id) => s.views[id] === true && s.views[directions[id].partner] === true);
  if (canMirror.length) compare('Mirror west side', (next) => {
    for (const id of canMirror) next.views[id] = directions[id].partner;
  });
  s.character.items.slice(0, s.items).forEach((original, index) => {
    if (!original.held || original.all) return;
    const item = itemAt(s, index);
    const usual = [...original.exceptions].filter((move) => move < s.moves && covers(item, move));
    if (!usual.length || usual.length === coveredCount(item, s.moves)) return;
    const label = item.name + ' on ' + usual.map((move) => moveAt(s, move).name).join(', ') + ' only';
    compare(label, (next) => next.itemEdits.set(index, { ...item, all: false, exceptions: new Set(usual) }));
  });
  for (const [index, frames] of s.frameEdits) {
    const original = s.character.moves[index] ?? s.typical;
    if (index >= s.moves || original.route !== 'authored' || frames <= poseThreshold || original.frames > poseThreshold) continue;
    compare(moveAt(s, index).name + ' to 12 frames', (next) => {
      if (original.frames === poseThreshold) next.frameEdits.delete(index);
      else next.frameEdits.set(index, poseThreshold);
    });
  }

  const initialItems = s.character.items.length;
  if (initialItems < s.items) {
    const result = estimate(s);
    const usableSource = (entry) => !entry.held && entry.recolorOf === undefined && entry.all
      && !entry.exceptions.size && s.character.moves.every((_, move) =>
        move >= s.moves || result.coveredFacings(entry, move).length === result.facings.length);
    const sourceIndex = initialItems === 0 && usableSource(itemAt(s, 0))
      ? 0 : s.character.items.findIndex((_, index) => usableSource(itemAt(s, index)));
    if (sourceIndex >= 0) {
      let index = Math.max(initialItems, sourceIndex + 1);
      while (index < s.items && itemAt(s, index).recolorOf !== undefined) index++;
      if (index < s.items) {
        const item = itemAt(s, index);
        compare('Use ' + itemAt(s, sourceIndex).name + ' recolor for ' + item.name,
          (next) => next.itemEdits.set(index, { ...item, recolorOf: sourceIndex }));
      }
    }
  }
  return candidates.sort((a, b) => b.saving - a.saving).slice(0, 2);
}
function renderActions(s, total, plan) {
  const reset = $('#reset');
  reset.hidden = tier === initialTier && (scope === 'all' ? allRetries === allInitialRetries :
    s.retries === (retryFlag ?? retryRate(s.character.records)) && s.moves === s.character.moves.length
    && s.items === s.character.items.length && s.states === s.character.states && !s.frameEdits.size && !s.itemEdits.size
    && Object.keys(directions).every((id) => s.views[id] === s.character.views[id]));
  const tips = scope === 'all' || s.character.locked ? [] : candidateTips(s, total, plan);
  $('#tips').replaceChildren(...tips.map(({ label, next, saving }) => {
    const tip = button(label + ' −' + cash(saving), 'bu-action tip');
    tip.addEventListener('click', () => {
      scenarios.set(s.character, next);
      update();
      (reset.hidden ? $('#title') : reset).focus();
    });
    return tip;
  }));
  $('#actions').hidden = reset.hidden && !tips.length;
}

function renderRecorded(records, cost, note, plan) {
  const receipts = records.flatMap(({ paid, replaced }) => [paid, ...replaced]);
  const unknown = receipts.filter(({ unpriced }) => unpriced).length;
  const gens = sum(receipts.map(({ gens }) => gens ?? 0));
  const credit = sum(receipts.map(({ usd }) => usd ?? 0));
  note.textContent = unknown ? unknown + (unknown === 1 ? ' unpriced call' : ' unpriced calls') : '';
  const amount = showCost(cost, gens, plan, credit);
  $('#spent').textContent = 'Spent ' + amount + ' · ' + units(gens);
}
function renderAll(results, plan) {
  const rows = roster.map((character, index) => {
    const row = button('', 'bu-action receipt-line receipt-link');
    row.id = 'character-row-' + index;
    row.innerHTML = '<span class="label"></span><span class="cost"></span>' + icon('chevron-right');
    row.querySelector('.label').textContent = character.name;
    showCost(row.querySelector('.cost'), results[index].total, plan);
    row.addEventListener('click', () => {
      selected = character;
      switchScope('character');
      $('[data-scope="character"]').focus();
    });
    return row;
  });
  const recorded = document.createElement('div');
  recorded.className = 'receipt-line';
  recorded.innerHTML = '<span class="label">Recorded usage <span class="setting"></span></span><span class="cost"></span>';
  renderRecorded(allRecords, recorded.querySelector('.cost'), recorded.querySelector('.setting'), plan);
  $('#all-receipt').replaceChildren(...rows, recorded);
}
function renderReceipt(s, result, plan) {
  const { character } = s;
  const { setup, body, items, states, facings } = result;
  const directionLabel = Object.keys(s.views).length + ' directions · ' + facings.length + ' drawn';
  const canvas = character.body + ' px body · ' + character.frame + ' px frame';
  $('#demo-note').hidden = !character.demo;
  $('#demo-note').textContent = character.locked ? 'Demo art is free. Use an editable copy to estimate additions.' : 'Copied demo art is free wherever it matches.';
  $('#setup-note').textContent = canvas + ' · V3 text draw, registration and cold joint checks';
  $('#state-note').textContent = character.stateRoute === 'pro'
    ? 'Local Pro from Standing · optional cold joint checks included'
    : 'Pixen from Standing · one packed edit per State';
  for (const [key, label, gens] of [
    ['setup', directionLabel, setup], ['moves', count(s.moves) + (s.moves === 1 ? ' move' : ' moves'), body],
    ['items', count(s.items) + (s.items === 1 ? ' design' : ' designs'), items],
    ['states', count(s.states) + ' · ' + routeNames[character.stateRoute], states]
  ]) {
    const row = $('#' + key + '-row');
    row.querySelector('summary .setting').textContent = label;
    showCost(row.querySelector('summary .cost'), gens, plan);
  }
  renderRows(s, result, plan);
  renderRecorded(character.records, $('#recorded-cost'), $('#unpriced'), plan);
}

function update(activeInput) {
  const focused = document.activeElement.id;
  const s = current();
  const all = scope === 'all';
  const locked = !all && s.character.locked;
  const plan = planFor(tier);
  const results = all ? rosterSeeds.map((saved) => estimate(saved, allRetries)) : [estimate(s)];
  const total = sum(results.map((result) => result.total));
  const low = cash(costAt(total, plan.low, plan));
  const high = cash(listCost(total, plan));
  $('#headline').textContent = high;
  $('#range').textContent = (low === high ? '' : low + ' to ' + high + ' · ') + count(Math.round(total)) + ' gens';
  $('#basis').textContent = (all ? roster.length + ' characters · saved values'
    : s.character.locked ? 'Bundled demo' : s.character.demo ? 'Added or changed art'
    : scope === 'new' ? 'New character' : 'Rebuild estimate') + (tier === '0' ? ' · Tier 1 rates' : '');
  $('#spent').hidden = scope === 'new';
  $('#tier').value = tier;
  $('#character-controls').hidden = all || locked;
  $('#retry-control').hidden = locked;
  const source = (all ? allRecords : s.character.records).length
    ? all ? 'from saved characters' : 'from this character' : 'default';
  const baseline = all ? allInitialRetries : retryFlag ?? retryRate(s.character.records);
  $('#retry-source').textContent = (all ? allRetries : s.retries) !== baseline ? 'edited'
    : retryFlag !== undefined ? 'preview override' : source;
  retryControl.refresh(activeInput === retryControl.input);
  for (const control of countControls) control.refresh(activeInput === control.input);
  $('#receipt').hidden = all;
  $('#all-receipt').hidden = !all;
  if (all) renderAll(results, plan);
  else {
    refreshCompass(s, results[0].facings);
    renderReceipt(s, results[0], plan);
  }
  renderActions(s, total, plan);
  if (focused && document.activeElement === document.body) document.getElementById(focused)?.focus({ preventScroll: true });
}

function switchScope(next) {
  if (next !== scope) {
    moveLimit = itemLimit = pageSize;
    coverageLimits.clear();
    for (const detail of document.querySelectorAll('#receipt details')) detail.open = false;
    $('#moves').replaceChildren();
    $('#items').replaceChildren();
  }
  scope = next;
  $('#character-name').textContent = selected.name;
  const characterTab = $('[data-scope="character"]');
  characterTab.firstElementChild.textContent = selected.name;
  characterTab.title = selected.name;
  for (const segment of document.querySelectorAll('[data-scope]')) {
    segment.setAttribute('aria-pressed', String(segment.dataset.scope === scope));
  }
  $('.facts').textContent = selected.frame + ' px · ' + Object.keys(selected.views).length +
    ' directions · ' + selected.moves.length + ' moves · ' + selected.items.length + ' items';
  update();
}
for (const segment of document.querySelectorAll('[data-scope]')) {
  segment.addEventListener('click', () => switchScope(segment.dataset.scope));
}
for (const id of ['details', 'moves-row', 'items-row']) {
  $('#' + id).addEventListener('toggle', (event) => {
    if (event.target.open && scope !== 'all') {
      const s = current();
      renderRows(s, estimate(s), planFor(tier));
    }
  });
}
$('#tier').addEventListener('change', () => {
  tier = $('#tier').value;
  update();
});
$('#reset').addEventListener('click', () => {
  tier = initialTier;
  if (scope === 'all') allRetries = allInitialRetries;
  else scenarios.delete(current().character);
  update();
  $('#tier').focus();
});

document.body.classList.toggle('preview-phone', query.has('phone'));
const appearance = $('#appearance');
appearance.value = query.get('theme') === 'light' ? 'light' : 'dark';
function setAppearance() {
  document.documentElement.dataset.theme = appearance.value;
  $('.studio-settings use').setAttribute('href', appearance.value === 'light' ? '#moon' : '#sun');
}
setAppearance();
appearance.addEventListener('change', setAppearance);
$('#details').open = query.has('details');
switchScope(scope);
$('#open-calculator').addEventListener('click', () => {
  $('#character-actions').hidePopover();
  sheet.showModal();
});
$('#close-calculator').addEventListener('click', () => sheet.close());
sheet.addEventListener('close', () => $('#character-menu').focus());
if (!query.has('studio')) sheet.showModal();
</script>
