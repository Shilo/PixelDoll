<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>PixelDoll • Sol design study</title
  ><style>
    /* Owned semantic roles. Dark/light are first-class, not an inversion filter.
   Only this file defines UI colors, shared geometry, type and material values. */
    :root {
      color-scheme: dark;
      --bu-canvas: #111317;
      --bu-surface: #202329;
      --bu-field: #202329;
      --bu-text: #f2eee6;
      --bu-muted: #b8b5ad;
      --bu-accent: #c9a66b;
      --bu-on-accent: #111317;
      --bu-success: #84c79a;
      --bu-warning: #e7bc75;
      --bu-danger: #f2a099;
      --bu-info: #9bbce5;
      --bu-shadow: 0 8px 28px rgb(0 0 0 / 0.18);
      --bu-dialog-shadow: 0 20px 64px rgb(0 0 0 / 0.32);
      --bu-scrim: rgb(0 0 0 / 0.5);
      --bu-font: "Segoe UI", system-ui, sans-serif;
      --bu-display: Georgia, "Times New Roman", serif;
      --bu-mono: ui-monospace, Consolas, monospace;
      --bu-radius-control: 8px;
      --bu-radius-panel: 12px;
      --bu-radius-dialog: 16px;
      --bu-space-1: 4px;
      --bu-space-2: 8px;
      --bu-space-3: 12px;
      --bu-space-4: 16px;
      --bu-space-6: 24px;
      --bu-space-8: 32px;
      --bu-control: 44px;
      --bu-text-size: 16px;
      --bu-small: 14px;
      --bu-line-height: 1.5;
      --bu-duration: 140ms;
      --bu-blur: 12px;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bu-canvas: #eeeae2;
      --bu-surface: #faf7f0;
      --bu-field: #faf7f0;
      --bu-text: #25282d;
      --bu-muted: #5e625f;
      --bu-accent: #76562f;
      --bu-on-accent: #fff;
      --bu-success: #226c43;
      --bu-warning: #775319;
      --bu-danger: #a3312f;
      --bu-info: #345f8e;
      --bu-shadow: 0 8px 28px rgb(0 0 0 / 0.1);
      --bu-dialog-shadow: 0 20px 64px rgb(0 0 0 / 0.2);
      --bu-scrim: rgb(0 0 0 / 0.34);
    }
    /* Derived roles resolve at the same scope as the scheme. */
    :root {
      --bu-line: color-mix(in srgb, var(--bu-muted) 27%, var(--bu-surface));
      --bu-border: color-mix(in srgb, var(--bu-muted) 80%, var(--bu-surface));
      --bu-rim: color-mix(in srgb, var(--bu-muted) 38%, transparent);
      --bu-hover: color-mix(in srgb, var(--bu-text) 7%, var(--bu-surface));
      --bu-selected: color-mix(
        in srgb,
        var(--bu-accent) 13%,
        var(--bu-surface)
      );
      --bu-floating: color-mix(in srgb, var(--bu-surface) 92%, transparent);
      --bu-focus: var(--bu-accent);
      --bu-sheet: color-mix(in srgb, var(--bu-surface) 99%, transparent);
      --bu-sheet-soft: color-mix(in srgb, var(--bu-surface) 86%, transparent);
      --bu-diagram: color-mix(in srgb, var(--bu-surface) 15%, transparent);
      --bu-gesture-track: color-mix(
        in srgb,
        var(--bu-surface) 20%,
        transparent
      );
      --bu-gesture-thumb: color-mix(in srgb, var(--bu-accent) 35%, transparent);
      --bu-action-hover: color-mix(in srgb, var(--bu-surface) 80%, transparent);
      --bu-outline: color-mix(in srgb, var(--bu-surface) 40%, transparent);
      --bu-row-stroke: color-mix(in srgb, var(--bu-accent) 30%, transparent);
      --bu-row-selected: color-mix(in srgb, var(--bu-accent) 12%, transparent);
      --bu-direction-selected: color-mix(
        in srgb,
        var(--bu-accent) 14%,
        transparent
      );
      --bu-tile: color-mix(in srgb, var(--bu-surface) 65%, transparent);
      --bu-reading-start: color-mix(
        in srgb,
        var(--bu-surface) 85%,
        transparent
      );
      --bu-reading-end: color-mix(in srgb, var(--bu-surface) 88%, transparent);
      --bu-scroll-thumb: color-mix(
        in srgb,
        var(--bu-muted) 60%,
        var(--bu-accent)
      );
      --bu-scroll-track: transparent;
    }
    :root[data-theme="light"] {
      --bu-reading-start: color-mix(
        in srgb,
        var(--bu-surface) 90%,
        transparent
      );
      --bu-reading-end: color-mix(in srgb, var(--bu-surface) 92%, transparent);
    }
    @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
      :root,
      :root[data-theme] {
        --bu-floating: var(--bu-surface);
        --bu-action-hover: var(--bu-hover);
        --bu-outline: var(--bu-surface);
        --bu-row-stroke: var(--bu-accent);
        --bu-row-selected: var(--bu-selected);
        --bu-direction-selected: var(--bu-selected);
        --bu-tile: var(--bu-surface);
        --bu-reading-start: var(--bu-surface);
        --bu-reading-end: var(--bu-surface);
        --bu-sheet: var(--bu-surface);
        --bu-sheet-soft: var(--bu-surface);
        --bu-diagram: var(--bu-surface);
        --bu-gesture-track: var(--bu-surface);
        --bu-gesture-thumb: var(--bu-accent);
        --bu-blur: 0px;
        --bu-rim: var(--bu-muted);
        --bu-border: var(--bu-muted);
      }
      .bu-floating {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
    }
    @supports not (
      (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
    ) {
      :root {
        --bu-floating: var(--bu-surface);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      :root {
        --bu-duration: 0ms;
      }
      .bu-spinner {
        animation: none !important;
      }
    }
    @media (forced-colors: active) {
      :root,
      :root[data-theme] {
        --bu-canvas: Canvas;
        --bu-surface: Canvas;
        --bu-field: Canvas;
        --bu-floating: Canvas;
        --bu-text: CanvasText;
        --bu-muted: CanvasText;
        --bu-accent: Highlight;
        --bu-on-accent: HighlightText;
        --bu-border: ButtonText;
        --bu-line: GrayText;
        --bu-rim: CanvasText;
        --bu-focus: Highlight;
        --bu-success: CanvasText;
        --bu-warning: CanvasText;
        --bu-danger: CanvasText;
        --bu-info: CanvasText;
        --bu-selected: Canvas;
        --bu-hover: Canvas;
        --bu-sheet: Canvas;
        --bu-sheet-soft: Canvas;
        --bu-diagram: Canvas;
        --bu-gesture-track: Canvas;
        --bu-gesture-thumb: Highlight;
        --bu-action-hover: Canvas;
        --bu-outline: Canvas;
        --bu-row-stroke: Highlight;
        --bu-row-selected: Canvas;
        --bu-direction-selected: Canvas;
        --bu-tile: Canvas;
        --bu-reading-start: Canvas;
        --bu-reading-end: Canvas;
      }
      .bu-floating {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      :is(.bu-btn, .bu-row, .bu-swatch)[aria-pressed="true"],
      .bu-tabs [aria-selected="true"],
      .bu-choice-group [aria-checked="true"] {
        outline: 2px solid Highlight;
      }
    }

    /* Inherited into nested scrollports. Keep native width/hit testing and OS overlay behavior. */
    :root {
      scrollbar-color: var(--bu-scroll-thumb) var(--bu-scroll-track);
      scrollbar-width: auto;
    }
    @supports not (scrollbar-color: auto) {
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track,
      ::-webkit-scrollbar-corner {
        background: var(--bu-scroll-track);
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--bu-scroll-thumb);
        background-clip: padding-box;
        border: 3px solid transparent;
        border-radius: var(--bu-radius-control);
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--bu-accent);
      }
    }
    @media (forced-colors: active) {
      :root {
        scrollbar-color: auto;
      }
    }

    /* Component recipes only. Import base.css explicitly for document defaults. */
    :is([class^="bu-"], [class*=" bu-"]),
    :is([class^="bu-"], [class*=" bu-"]) * {
      box-sizing: border-box;
    }
    .bu-btn,
    .bu-action,
    .bu-input,
    .bu-unit input,
    .bu-color,
    .bu-swatch,
    .bu-row,
    .bu-select,
    .bu-tabs button {
      font: inherit;
      color: inherit;
    }
    :where(.bu-btn, .bu-action, .bu-row, .bu-swatch) {
      cursor: pointer;
    }
    :where(
      .bu-focus,
      .bu-action,
      .bu-select,
      .bu-btn,
      .bu-input,
      .bu-unit input,
      .bu-check input,
      .bu-color,
      .bu-row,
      .bu-swatch,
      .bu-tabs button,
      .bu-details summary
    ):focus-visible {
      outline: 2px solid var(--bu-focus);
      outline-offset: var(--bu-focus-offset, 3px);
    }
    :where(.bu-btn, .bu-input, .bu-unit input, .bu-check input):disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    :is(.bu-btn, .bu-notice, .bu-choice-group, .bu-badge, .bu-steps) svg {
      flex: none;
      width: 20px;
      height: 20px;
      stroke-width: 1.6;
    }
    .bu-muted {
      color: var(--bu-muted);
    }
    .bu-small {
      font-size: var(--bu-small);
    }
    .bu-number {
      font-variant-numeric: tabular-nums;
    }
    .bu-sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .bu-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--bu-space-2);
    }
    .bu-stack {
      display: grid;
      gap: var(--bu-space-4);
    }
    .bu-separator {
      margin: 0;
      border: 0;
      border-top: 1px solid var(--bu-line);
    }
    /* Appearance-only actions for hosts that own control geometry. */
    .bu-action {
      color: inherit;
      background: none;
      border: 0;
      border-radius: var(--bu-radius-control);
    }
    .bu-action:hover:not(:disabled):not([aria-disabled="true"]):not(
        :has(> input:disabled)
      ) {
      background: var(--bu-action-hover);
    }
    .bu-action:is(:disabled, [aria-disabled="true"]) {
      opacity: 0.42;
      cursor: not-allowed;
    }
    .bu-action:is([aria-pressed="true"], [aria-selected="true"]) {
      color: var(--bu-accent);
    }
    .bu-action[data-variant="primary"] {
      font-weight: 600;
    }
    .bu-action[data-variant="primary"] svg {
      fill: none;
      stroke: currentColor;
    }
    .bu-action:is(
      [data-variant="outline"],
      [data-variant="tile"],
      [data-variant="field"]
    ) {
      color: var(--bu-text);
    }
    .bu-action[data-variant="outline"] {
      border: 1px solid var(--bu-line);
      background: var(--bu-outline);
    }
    .bu-action[data-variant="tile"] {
      border: 1px solid var(--bu-rim);
      background: var(--bu-tile);
    }
    .bu-action[data-variant="field"] {
      border: 1px solid var(--bu-border);
      background: var(--bu-field);
    }
    .bu-action:is(
        [data-variant="outline"],
        [data-variant="tile"],
        [data-variant="field"]
      ):hover:not(:disabled):not([aria-disabled="true"]):not(
        :has(> input:disabled)
      ) {
      border-color: var(--bu-border);
      background: var(--bu-hover);
    }
    :is(
      .bu-btn,
      .bu-action:is(
        [data-variant="outline"],
        [data-variant="tile"],
        [data-variant="field"]
      )
    )[aria-pressed="true"] {
      color: var(--bu-accent);
      border-color: var(--bu-accent);
      background: var(--bu-selected);
    }
    .bu-action[data-variant="row"] {
      border: 1px solid transparent;
    }
    .bu-action[data-variant="row"][aria-pressed="true"] {
      border-color: var(--bu-row-stroke);
      background: var(--bu-row-selected);
    }
    .bu-action[data-variant="direction"][aria-pressed="true"] {
      background: var(--bu-direction-selected);
    }
    /* Hover feedback keeps the selected label; host retains control geometry. */
    .bu-action:is(
        [data-variant="outline"],
        [data-variant="tile"],
        [data-variant="field"]
      )[aria-pressed="true"]:hover:not(:disabled):not(
        [aria-disabled="true"]
      ):not(:has(> input:disabled)) {
      background: var(--bu-hover);
      border-color: var(--bu-border);
    }

    .bu-btn {
      color: var(--bu-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--bu-space-2);
      min-height: var(--bu-control);
      padding: 10px 16px;
      border: 1px solid var(--bu-border);
      border-radius: var(--bu-radius-control);
      background: var(--bu-surface);
      font-weight: 500;
      text-decoration: none;
      line-height: 1.25;
      transition: background-color var(--bu-duration);
    }
    .bu-btn[aria-disabled="true"] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bu-btn:hover:not(:disabled):not([aria-disabled="true"]) {
      background: var(--bu-hover);
    }
    .bu-btn:active:not(:disabled):not([aria-disabled="true"]) {
      box-shadow: inset 0 0 0 1px currentColor;
    }
    :is(.bu-btn, .bu-action)[data-variant="primary"] {
      background: var(--bu-accent);
      color: var(--bu-on-accent);
      border-color: transparent;
    }
    :is(.bu-btn, .bu-action)[data-variant="primary"]:hover:not(:disabled):not(
        [aria-disabled="true"]
      ):not(:has(> input:disabled)) {
      background: var(--bu-accent);
      box-shadow: inset 0 0 0 2px var(--bu-on-accent);
    }
    .bu-btn[data-variant="quiet"] {
      background: transparent;
      border-color: transparent;
      color: var(--bu-muted);
    }
    .bu-btn[data-variant="danger"] {
      color: var(--bu-danger);
      border-color: var(--bu-danger);
    }
    .bu-btn[data-icon] {
      min-width: var(--bu-control);
      padding: 10px;
    }
    .bu-btn[aria-pressed="true"] {
      box-shadow: inset 0 -2px 0 var(--bu-accent);
    }
    /* Compact native field appearance, without input dimensions. */
    select.bu-select:not(.bu-input) {
      border: 1px solid var(--bu-border);
      border-radius: var(--bu-radius-control);
      background: var(--bu-field);
      color: var(--bu-text);
    }
    select.bu-select:is(:disabled, [aria-disabled="true"]) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* A labelled select inside a bounded toolbar needs no second field box. */
    select.bu-select[data-variant="quiet"] {
      border-color: transparent;
      background: transparent;
      color: inherit;
    }
    select.bu-select[data-variant="quiet"]:hover:not(:disabled):not(
        [aria-disabled="true"]
      ) {
      background: var(--bu-action-hover);
    }
    /* Joined controls share one seam; host chooses widths and outer layout. */
    .bu-joined {
      display: flex;
    }
    .bu-joined > :first-child:not(:only-child) {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .bu-joined > :last-child:not(:only-child) {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      margin-left: -1px;
    }
    .bu-joined > :focus-visible {
      position: relative;
      z-index: 1;
    }
    @media (max-width: 380px) {
      .bu-joined[data-stack="small"] {
        flex-direction: column;
      }
      .bu-joined[data-stack="small"] > :first-child:not(:only-child) {
        border-radius: var(--bu-radius-control) var(--bu-radius-control) 0 0;
      }
      .bu-joined[data-stack="small"] > :last-child:not(:only-child) {
        margin-left: 0;
        margin-top: -1px;
        border-radius: 0 0 var(--bu-radius-control) var(--bu-radius-control);
      }
    }
    .bu-dialog-surface {
      color: var(--bu-text);
      background: var(--bu-surface);
      border: 1px solid var(--bu-rim);
      border-radius: var(--bu-radius-dialog);
      box-shadow: var(--bu-dialog-shadow);
    }
    .bu-field {
      display: grid;
      align-content: start;
      gap: 6px;
      min-width: 0;
    }
    .bu-field > label {
      font-size: var(--bu-small);
      font-weight: 600;
    }
    .bu-input {
      color: var(--bu-text);
      width: 100%;
      min-width: 0;
      min-height: var(--bu-control);
      padding: 10px 12px;
      border: 1px solid var(--bu-border);
      border-radius: var(--bu-radius-control);
      background: var(--bu-field);
    }
    select:is(.bu-input, .bu-select) option:disabled {
      color: var(--bu-muted);
      opacity: 0.5;
    }
    select:is(.bu-input, .bu-select) optgroup:disabled {
      color: var(--bu-muted);
    }
    /* Native menus share the field theme without requiring document-wide resets.
   bu-select adds only picker styling for compact, host-sized controls. */
    select:is(.bu-input, .bu-select),
    select:is(.bu-input, .bu-select) :is(option, optgroup) {
      color-scheme: inherit;
    }
    select:is(.bu-input, .bu-select) :is(option, optgroup) {
      color: var(--bu-text);
      background-color: var(--bu-field);
    }
    @supports (appearance: base-select) and selector(select::picker(select)) {
      select:is(.bu-input, .bu-select),
      select:is(.bu-input, .bu-select)::picker(select) {
        appearance: base-select;
      }
      /* base-select lays out as inline-flex; center the value when hosts set a taller fixed height. */
      select:is(.bu-input, .bu-select) {
        align-items: center;
      }
      select:is(.bu-input, .bu-select)::picker(select) {
        color: var(--bu-text);
        background: var(--bu-field);
        border: 1px solid var(--bu-border);
        border-radius: var(--bu-radius-control);
        box-shadow: var(--bu-shadow);
        padding: 4px;
        max-height: min(320px, 60dvh);
      }
      select:is(.bu-input, .bu-select) option {
        min-height: 44px;
        padding: 8px 12px;
        border-radius: calc(var(--bu-radius-control) / 2);
        font: var(--bu-text-size)/var(--bu-line-height) var(--bu-font);
      }
      select:is(.bu-input, .bu-select) option:checked:not(:disabled) {
        color: var(--bu-accent);
        background: var(--bu-selected);
      }
      select:is(.bu-input, .bu-select)
        option:not(:disabled):is(:hover, :focus) {
        color: var(--bu-text);
        background: var(--bu-hover);
        outline: 2px solid var(--bu-focus);
        outline-offset: -2px;
      }
    }

    .bu-input::placeholder {
      color: var(--bu-muted);
      opacity: 1;
    }
    textarea.bu-input {
      min-height: 112px;
      resize: vertical;
    }
    .bu-input[aria-invalid="true"] {
      border-color: var(--bu-danger);
      box-shadow: inset 3px 0 var(--bu-danger);
    }
    .bu-input[readonly] {
      border-style: dashed;
    }
    .bu-field > :is(p, .bu-error) {
      margin: 0;
    }
    .bu-error {
      color: var(--bu-danger);
      font-size: var(--bu-small);
    }
    .bu-unit {
      color: var(--bu-text);
      display: flex;
      align-items: center;
      border: 1px solid var(--bu-border);
      border-radius: var(--bu-radius-control);
      background: var(--bu-field);
    }
    .bu-unit input {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 10px 12px;
      min-height: var(--bu-control);
      border-radius: inherit;
    }
    .bu-unit span {
      padding-right: 12px;
      color: var(--bu-muted);
    }
    .bu-unit:has([aria-invalid="true"]) {
      border-color: var(--bu-danger);
      box-shadow: inset 3px 0 var(--bu-danger);
    }
    .bu-check {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: var(--bu-control);
      cursor: pointer;
    }
    .bu-check:has(> input:disabled) {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bu-check > input:disabled {
      opacity: 1;
      cursor: not-allowed;
    }
    .bu-check input:is([type="checkbox"], [type="radio"]) {
      width: 20px;
      height: 20px;
      flex: none;
      accent-color: var(--bu-accent);
    }
    .bu-check input.bu-switch {
      appearance: none;
      position: relative;
      width: 44px;
      height: 26px;
      border: 1px solid var(--bu-border);
      border-radius: 13px;
      background: var(--bu-surface);
      margin: 0;
      cursor: pointer;
    }
    .bu-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bu-muted);
    }
    .bu-check input.bu-switch:disabled {
      cursor: not-allowed;
    }
    .bu-check input.bu-switch:checked {
      background: var(--bu-accent);
      border-color: var(--bu-accent);
    }
    .bu-switch:checked::after {
      left: 21px;
      background: var(--bu-on-accent);
    }
    .bu-file {
      width: 100%;
      min-width: 0;
      font-size: var(--bu-small);
    }
    .bu-file:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bu-file:disabled::file-selector-button {
      cursor: not-allowed;
    }
    .bu-file::file-selector-button {
      min-height: var(--bu-control);
      margin-right: 12px;
      border: 1px solid var(--bu-border);
      border-radius: var(--bu-radius-control);
      color: var(--bu-text);
      background: var(--bu-surface);
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    .bu-tabs {
      display: flex;
      gap: 20px;
      overflow: auto;
      padding: 6px;
    }
    .bu-tabs button {
      color: var(--bu-muted);
      min-height: var(--bu-control);

          width: min(560px, calc(100% - 32px));

          max-height: calc(100dvh - 32px);

          display: flex;

          top: 0;
          border-bottom: 1px solid var(--bu-line);

          color: var(--bu-text);
          width: min(380px, calc(100vw - 24px));
          max-height: calc(100dvh - 24px);
          overflow: auto;
          padding: 16px;
          margin: 0;
        }
        .bu-popover-anchor {
          position: fixed;
          inset: auto;
          width: max-content;
          max-width: calc(100vw - 16px);
          margin: 0;
          padding: 0;
          overflow: visible;
          border: 0;
          background: transparent;
          box-shadow: none;
        }
        .bu-popover-anchor > .bu-popover-surface {
          position: relative;
          z-index: 1;
        }
        .bu-popover-arrow {
          position: absolute;
          z-index: 2;
          width: 12px;
          height: 12px;
          fill: var(--bu-surface);
          pointer-events: none;
        }
        .bu-popover-arrow path:last-child {
          fill: none;
          stroke: var(--bu-rim);
          stroke-width: 1;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .bu-popover-anchor[data-side="bottom"] > .bu-popover-arrow {
          top: -8px;
          left: var(--bu-arrow-x);
        }
        .bu-popover-anchor[data-side="top"] > .bu-popover-arrow {
          bottom: -8px;
          left: var(--bu-arrow-x);
          transform: rotate(180deg);
        }
        .bu-popover-anchor[data-side="right"] > .bu-popover-arrow {
          left: -8px;
          top: var(--bu-arrow-y);
          transform: rotate(-90deg);
        }
        .bu-popover-anchor[data-side="left"] > .bu-popover-arrow {
          right: -8px;
          top: var(--bu-arrow-y);
          transform: rotate(90deg);
        }
        .bu-popover-anchor[data-arrow-hidden] > .bu-popover-arrow {
          display: none;
        }

          position: relative;
          display: inline-flex;
        }

          color: var(--bu-muted);
        }
        .bu-tooltip {

          z-index: 5;
          box-sizing: border-box;
          margin: 0;
          width: min(300px, calc(100vw - 24px));
          padding: 12px 16px;
          background: var(--bu-surface);
          border: 1px solid var(--bu-rim);
          border-radius: var(--bu-radius-panel);
          color: var(--bu-text);
          box-shadow: var(--bu-shadow);
          font-size: var(--bu-small);
        }
        .bu-tooltip-anchor > .bu-tooltip {
          display: block;
          position: relative;
        }
        .bu-tooltip-anchor:popover-open:not([data-positioned]) {
          visibility: hidden;
        }
        .bu-toast {
          --tone: var(--bu-info);
          position: fixed;
          bottom: max(24px, env(safe-area-inset-bottom));
          left: 50%;
          transform: translateX(-50%);
          box-sizing: border-box;
          max-width: calc(100% - 32px);
          width: max-content;
          padding: 12px 16px;
          display: flex;
          gap: 12px;
          align-items: center;
          z-index: 10;
          color: var(--bu-text);
          background: color-mix(in srgb, var(--tone) 8%, var(--bu-surface));
          border: 1px solid var(--bu-rim);
          border-inline-start: 3px solid var(--tone);
          border-radius: var(--bu-radius-panel);
          box-shadow: var(--bu-shadow);
          font: var(--bu-small)/var(--bu-line-height) var(--bu-font);
          overflow-wrap: anywhere;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }

          height: 20px;
          color: var(--tone);

        .bu-toast:empty {

        /* Underlined navigation without imposing the host's spacing or target size. */
        .bu-action[data-variant="tab"] {

        /* Flat swatch appearance for a host-sized color chip. The swatch is user data. */
        .bu-swatch-flat {

            border-color: ButtonText;

          }

          function modal(title, body) {

          $("#new-item").onclick = () =>
            modal(
              "New " + cats[category].toLowerCase() + " item",
              '<p>Describe the item you want for Alden.</p><label>Item description<input class="bu-input" placeholder="e.g. weathered steel armor"></label><p>Estimated cost: ~2–5 gens. Review the estimate before creating.</p><button class="bu-btn" data-variant="primary" data-action="mockcreate">Review estimate</button><p><small>Design prototype. No credits will be spent.</small></p>',

              let [i, j] = b.dataset.item.split(",").map(Number),
                top = $(".inventory").scrollTop;

              modal(
                "Inspect frames",
                "<p>Walk · " +
                  ["South", "East", "North", "West"][dir] +
                  " · frame " +
                  (frame + 1) +
                  ' of 8</p><canvas id="inspection" width="256" height="256" style="width:256px;height:256px;max-width:100%;image-rendering:pixelated"></canvas><p>64 × 64 source cell. No smoothing.</p>',
              );
            if (a === "export")
              modal(
                "Export Alden",
                '<label>Engine<select class="bu-input"><option>Godot</option><option>Phaser</option><option>Unity</option><option>Aseprite</option><option>PNG + JSON</option></select></label><p>Separate equipment spritesheets and a matching manifest.</p><button class="bu-btn" data-variant="primary" data-action="download">Preview export</button>',
              );
            if (a === "download")
              notify(
                "Export flow demonstrated. No production spritesheet generated.",
              );
            if (a === "share")
              notify("Share action demonstrated. Nothing has been published.");
            if (a === "back")
              notify("Character library is outside this design study.");
            if (a === "activity") notify("No active generations.");
            if (a === "rename")
              modal(
                "Rename character",
                '<label>Name<input id="newname" class="bu-input" value="Alden"></label><button class="bu-btn" data-action="savename">Save name</button>',
              );
            if (a === "savename") {
              $(".name").firstChild.textContent =
                $("#newname").value.trim() || "Alden";

            if (a === "save") {
              savedOutfits.push({
                name: "Saved look " + (savedOutfits.length + 1),

              });

              notify("Current look saved in this mockup session.");
            }
            if (a === "addmove")
              modal(
                "Add a move",
                '<label>Move name<input class="bu-input" placeholder="e.g. Slash"></label><p>Choose and review a generation estimate before proceeding. No request is sent by this prototype.</p>',
              );
            if (a === "mockcreate")
              notify(
                "Estimate review demonstrated. No generation request sent.",
              );
            if (a === "walk" || a === "idle") {
              $("#move").value = a === "walk" ? "Walk" : "Idle";

              notify("Previewing " + a);

            if (b.classList.contains("close")) $("#dialog").close();
          });
          $("#dismiss").onclick = () => ($(".notice").hidden = true);
          $(".panel-toggle").onclick = () => {

              "aria-label",
              $(".main").classList.contains("expanded")
                ? "Restore character stage"
                : "Expand equipment panel",
            );

          };

            remember();

          };

            future.push({ selected: { ...selected }, look });
            ({ selected, look } = history.pop());
            if (tab === "Wardrobe") render();
            buttons();
          };

            ({ selected, look } = future.pop());

            buttons();

          function layout() {
            const s = $(".stage"),
              w = s.clientWidth,
              h = s.clientHeight;
            const top = $(".notice").hidden ? 8 : 60;
            const free = Math.max(60, h - top - 76);
            const k = Math.max(
              1,
              Math.floor(Math.min((free * 0.75) / 50, (w - 32) / 64)),
            );
            const size = k * 64,
              feet = Math.round(top + (free + 50 * k) / 2);
            const x = Math.round((w - size) / 2);
            Object.assign($(".actor").style, {
              width: size + "px",
              height: size + "px",
              left: x + "px",
              top: feet - size + "px",
            });
            const horizon =
              document.documentElement.dataset.theme === "light" ? 0.475 : 0.53;
            const eye = feet - 44 * k;
            const floor = 0.88;
            const scale = Math.max(
              w / 1672,
              0.25,
              Math.min(1.35, (feet - eye) / ((floor - horizon) * 941)),
            );
            const iw = 1672 * scale,
              ih = 941 * scale;
            const world = $(".world");
            world.src =
              "./assets/" +
              (document.documentElement.dataset.theme === "light"
                ? "porcelain"
                : "obsidian") +
              ".jpg";
            Object.assign(world.style, {
              width: iw + "px",
              height: ih + "px",
              left: w / 2 - iw / 2 + "px",
              top: feet - floor * ih + "px",
            });

              k,
              feet,
              eye,
              photoScale: scale,
              horizon,
              worldWidth: iw,
              stage: [w, h],

                $(".inventory").scrollTop = y;

          layout();

            $("#play").setAttribute("aria-label", "Play");
          }

  >
  <script>
    const frame = document.getElementById("frame"),
      mount = document.getElementById("mount");
    frame.srcdoc = document.getElementById("app").innerHTML;
    const native = new URLSearchParams(location.search).has("stage");
    if (native) document.body.classList.add("native");
    function size() {
      const val = document.getElementById("device").value;
      const room =
        innerHeight -
        (native ? 0 : document.querySelector(".lab").offsetHeight);
      let [w, h] =
        val === "fit" || native
          ? [innerWidth, room]
          : val.split("×").map(Number);
      let scale = Math.min(1, innerWidth / w, room / h);
      frame.style.width = w + "px";
      frame.style.height = h + "px";
      frame.style.transform = "scale(" + scale + ")";
      mount.style.width = w * scale + "px";
      mount.style.height = h * scale + "px";
    }
    document.getElementById("device").onchange = size;
    document.getElementById("theme").onchange = (e) => {
      document.documentElement.dataset.theme = e.target.value;
      frame.contentWindow.postMessage({ theme: e.target.value }, "*");
    };
    document.getElementById("continuous").onchange = (e) =>
      frame.contentWindow.postMessage({ continuous: e.target.checked }, "*");
    document.getElementById("wording").onchange = (e) =>
      frame.contentWindow.postMessage({ wording: e.target.value }, "*");
    window.addEventListener("resize", size);
    size();
  </script>
</html>
